html,body{margin:0;padding:0;-webkit-text-size-adjust:100%;}

button:disabled{opacity:.4;cursor:default;}
.root{max-width:1400px;margin:0 auto;}
@media (max-width:700px){
  .root{padding:0 10px 24px !important;gap:10px !important;}
  .nav{position:sticky;top:0;z-index:10;flex:1 1 100% !important;padding:8px 0 8px;gap:4px !important;border-bottom:1px solid rgba(128,128,128,.2);}
  .navtitle{padding:0 2px !important;display:inline;}
  .navsub{padding:0 2px !important;}
  .navbtn{flex:1 1 0 !important;min-width:0;text-align:center !important;padding:8px 4px !important;white-space:nowrap;}
  .board{flex-wrap:nowrap !important;overflow-x:auto;-webkit-overflow-scrolling:touch;scroll-snap-type:x mandatory;padding-bottom:6px;margin:0 -10px;padding-left:10px;padding-right:10px;}
  .col{flex:0 0 78% !important;scroll-snap-align:start;}
  input,select,textarea{font-size:16px !important;}
  .calcell{min-height:48px !important;}
}
